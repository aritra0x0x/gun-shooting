<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern FPS</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  </head>
  <body>
    <div id="game-container">
      <canvas id="gameCanvas"></canvas>
      <div id="hud">
        <div id="weapon-info">
          <div id="ammo">90/90</div>
          <div id="weapon-name">M4A1</div>
        </div>
        <div id="health-container">
          <div id="health-bar"></div>
          <div id="health-text">100</div>
        </div>
        <div id="minimap"></div>
        <div id="compass">N</div>
        <div id="crosshair">+</div>
        <div id="objective">Reach extraction point</div>
      </div>
      <div id="gameOver" class="hidden">
        Mission Failed<br />
        <button onclick="restartGame()">Retry Mission</button>
      </div>
      <div id="pauseMenu" class="hidden">
        <h2>GAME PAUSED</h2>
        <button onclick="resumeGame()">Resume</button>
        <button onclick="window.location.reload()">Restart</button>
      </div>
      <div id="notification" class="notification"></div>
    </div>
    <script src="game.js" type="module"></script>
  </body>
</html>
